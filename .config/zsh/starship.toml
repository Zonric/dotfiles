"$schema" = "https://starship.rs/config-schema.json"
continuation_prompt = '[∙](bright-black) '
scan_timeout = 30
command_timeout = 500
add_newline = true
follow_symlinks = true

format = '''
$directory$git_branch$git_commit$git_status$git_state$git_metrics
$sudo$status$golang$node$php$zig$python$character
'''

[directory]
	format = '[$read_only]($read_only_style)[$path]($style) '
	truncation_length = 0
	truncate_to_repo = false
	truncation_symbol = '/'
	read_only = ' '

[git_branch]
	disabled = false
	format = '[$branch(:$remote_name)]($style)'
	style = 'bold purple'

[git_commit]
	disabled = false
	format = '[(#$hash$tag)]($style) '
	style = 'bold green'
	only_detached = false
	tag_disabled = false
	tag_max_candidates = 0
	tag_symbol = ': '

[git_status]
	format = '[(\[$all_status$ahead_behind\])]($style) '
	ignore_submodules = true

[git_state]
	disabled = true
	format = '[$state(:$progress_current/$progress_total)]($style) '
	style = 'bold yellow'

[git_metrics]
	disabled = false
	ignore_submodules = true

[sudo]
	format = '[$symbol]($style)'
	symbol = ' '
	style = 'bold fg:#f5a623'
	disabled = false

[status]
	format = '[(\[$int\])]($style) '
	style = 'bold red'
	disabled = false

[python]
	format = '[$symbol$virtualenv ($version )]($style)'
	version_format = 'v${major}.${minor}'
	symbol = ' '

[golang]
	format = '[$symbol($version)]($style) '
	symbol = ' '

[nodejs]
	format = '[$symbol($version)]($style) '
	version_format = 'v${major}.${minor}'
	symbol = ' '

[php]
	format = '[$symbol($version)]($style) '
	version_format = 'v${major}.${minor}'
	symbol = ' '

[zig]
	format = '[$symbol($version)]($style) '
	version_format = 'v${major}.${minor}'
	symbol = ' '

[character]
	format = '[$symbol]($style) '
	success_symbol = '[](bold green)'
	error_symbol = '[](bold red)'
