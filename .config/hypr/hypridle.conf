general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch dpms on
}

# listener {
#     timeout = 10
#     on-timeout = brightnessctl -s set 10
#     on-resume = brightnessctl -r
# }

listener {
	timeout = 600
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off"})'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on"})'
}

listener {
	timeout = 720
	on-timeout = hyprctl dispatch 'hl.dsp.exec_cmd("powerprofilectl set power-saver")'
	on-resume = hyprctl dispatch 'hl.dsp.exec_cmd("powerprofilectl set balanced")'
}

listener {
	timeout = 840
	on-timeout = hyprctl dispatch 'hl.dsp.exec_cmd("pidof hyprlock || hyprlock")'
}
